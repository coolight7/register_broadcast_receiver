group 'com.hz.wu.register_broadcast_receiver.register_broadcast_receiver'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.hz.wu.register_broadcast_receiver.register_broadcast_receiver"
    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 19
    }
}

// AGP applies the Kotlin Gradle Plugin itself when built-in Kotlin is enabled,
// so the plugin must not apply it here (Flutter warns about plugins that apply
// the Kotlin Gradle Plugin and will fail builds that do in a future version).
// kotlin.compilerOptions works with both built-in Kotlin and the legacy plugin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}
